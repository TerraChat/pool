<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Pro Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #050505; color: white; overflow: hidden; font-family: sans-serif; }
        canvas { touch-action: none; border: 8px solid #451a03; border-radius: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        // Using esm.sh ensures the browser can run React without a build step
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@19.0.0';
        import { createRoot } from 'https://esm.sh/react-dom@19.0.0/client';

        // --- Constants ---
        const W = 800, H = 400, BALL_R = 10;

        const App = () => {
            const [screen, setScreen] = useState('menu');
            const canvasRef = useRef(null);

            useEffect(() => {
                if (screen !== 'game') return;
                const ctx = canvasRef.current.getContext('2d');
                
                // Simple Draw Loop
                const draw = () => {
                    ctx.fillStyle = '#065f46'; // Table Green
                    ctx.fillRect(0, 0, W, H);
                    
                    // Draw Cue Ball
                    ctx.beginPath();
                    ctx.arc(150, H/2, BALL_R, 0, Math.PI*2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.closePath();
                    
                    requestAnimationFrame(draw);
                };
                draw();
            }, [screen]);

            return React.createElement('div', { className: "flex flex-col items-center justify-center h-screen" },
                screen === 'menu' ? 
                React.createElement('div', { className: "text-center" },
                    React.createElement('h1', { className: "text-6xl font-bold mb-8 text-cyan-500" }, "POOL PRO"),
                    React.createElement('button', { 
                        onClick: () => setScreen('game'),
                        className: "bg-cyan-600 px-10 py-4 rounded-xl font-bold text-xl hover:bg-cyan-500 transition"
                    }, "PLAY NOW")
                ) : 
                React.createElement('div', { className: "relative" },
                    React.createElement('canvas', { ref: canvasRef, width: W, height: H }),
                    React.createElement('button', { 
                        onClick: () => setScreen('menu'),
                        className: "mt-4 text-neutral-500 block w-full text-center"
                    }, "Exit to Menu")
                )
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
